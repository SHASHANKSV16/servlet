<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>E-Commerce Product Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Booking forms</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
        <a class="nav-link" href="./movie.html">Movie</a>
        <a class="nav-link" href="./ECommerce.html">ECommerce</a>
        <a class="nav-link" href="./Food.html">Food</a>
        <a class="nav-link" href="./blood.html">Blood</a>
        <a class="nav-link" href="./flight.html">Flight</a>


      </div>
    </div>
  </div>
</nav>
  <div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm" style="width: 28rem;">
      <div class="card-body">
        <h4 class="card-title text-center mb-4">E-Commerce Product Booking</h4>

        <form id="productBookingForm" action="order" method="post">
          <div class="mb-3">
            <label for="customerName" class="form-label">Customer Name</label>
            <input type="text" class="form-control" id="customerName" name="customerName" placeholder="Enter your full name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
          </div>

          <div class="mb-3">
            <label for="productCategory" class="form-label">Product Category</label>
            <select class="form-select" id="productCategory" name="product" required>
              <option value="" selected disabled>Choose a category</option>
              <option value="Electronics">Electronics</option>
              <option value="Fashion">Fashion</option>
              <option value="HomeAppliances">Home Appliances</option>
              <option value="Books">Books</option>
              <option value="Sports">Sports</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="address" class="form-label">Delivery Address</label>
            <textarea class="form-control" id="address" name="address" rows="2" placeholder="Enter full address" required></textarea>
          </div>

          <fieldset class="mb-3">
            <legend class="col-form-label small">Payment Method</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment" id="cod" value="COD" required>
              <label class="form-check-label" >Cash on Delivery</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment" id="upi" value="UPI">
              <label class="form-check-label" >UPI</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment" id="card" value="Card">
              <label class="form-check-label" >Credit / Debit Card</label>
            </div>
          </fieldset>

          <div class="d-grid">
            <button type="submit" class="btn btn-success">Place Order</button>
          </div>
        </form>

      </div>
    </div>
  </div>

</body>
</html>
