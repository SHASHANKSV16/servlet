<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Movie Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Booking forms</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
        <a class="nav-link" href="./movie.html">Movie</a>
        <a class="nav-link" href="./ECommerce.html">ECommerce</a>
        <a class="nav-link" href="./Food.html">Food</a>
        <a class="nav-link" href="./blood.html">Blood</a>
        <a class="nav-link" href="./flight.html">Flight</a>


      </div>
    </div>
  </div>
</nav>
  <div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm" style="width: 28rem;">
      <div class="card-body">
        <h4 class="card-title text-center mb-4">Booking Form</h4>

        <form id="bookingForm" action="movie" method="post">
          <div class="mb-3">
            <label for="fullName" class="form-label">Name</label>
            <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Enter your full name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
          </div>

          <div class="mb-3">
            <label for="service" class="form-label">movie formats</label>
            <select class="form-select" id="service" name="service" required>
              <option value="Normal" selected disabled>Normal</option>
              <option value="3D">3D</option>
              <option value="IMAX">IMAX</option>
              <option value="4DX">4DX</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="notes" class="form-label">Coupon Code</label>
            <textarea class="form-control" id="code" name="code" rows="1" ></textarea>
          </div>

          <fieldset class="mb-3">
            <legend class="col-form-label small">Slot</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="slot" id="slotMorning" value="7:30 AM" required>
              <label class="form-check-label" >7:30 AM</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="slot" id="slotAfternoon" value="12:30 PM">
              <label class="form-check-label" >12:30 PM</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="slot" id="slotEvening" value="4:30 PM">
              <label class="form-check-label" >4:30 PM</label>
            </div>
          </fieldset>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Submit Booking</button>
          </div>
        </form>

      </div>
    </div>
  </div>

</body>
</html>
