<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flight Ticket Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Booking forms</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
        <a class="nav-link" href="./movie.html">Movie</a>
        <a class="nav-link" href="./ECommerce.html">ECommerce</a>
        <a class="nav-link" href="./Food.html">Food</a>
        <a class="nav-link" href="./blood.html">Blood</a>
        <a class="nav-link" href="./flight.html">Flight</a>


      </div>
    </div>
  </div>
</nav>
  <div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm" style="width: 28rem;">
      <div class="card-body">
        <h4 class="card-title text-center mb-4">Flight Ticket Booking</h4>

        <form id="flightBookingForm" action="flight" method="post">
          <div class="mb-3">
            <label for="passengerName" class="form-label">Passenger Name</label>
            <input type="text" class="form-control" id="passengerName" name="passengerName" placeholder="Enter full name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
          </div>

          <div class="mb-3">
            <label for="travelClass" class="form-label">Travel Class</label>
            <select class="form-select" id="travelClass" name="travelClass" required>
              <option value="" selected disabled>Select class</option>
              <option value="Economy">Economy</option>
              <option value="Premium Economy">Premium Economy</option>
              <option value="Business">Business</option>
              <option value="First Class">First Class</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="notes" class="form-label">Special Requests</label>
            <textarea class="form-control" id="notes" name="notes" rows="2" placeholder="e.g. window seat, meal preference"></textarea>
          </div>

          <fieldset class="mb-3">
            <legend class="col-form-label small">Trip Type</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tripType" id="oneWay" value="One Way" required>
              <label class="form-check-label" >One Way</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tripType" id="roundTrip" value="Round Trip">
              <label class="form-check-label" >Round Trip</label>
            </div>
          </fieldset>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Book Flight</button>
          </div>
        </form>

      </div>
    </div>
  </div>

</body>
</html>
