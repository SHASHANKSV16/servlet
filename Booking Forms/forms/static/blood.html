<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blood Booking Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Booking forms</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
        <a class="nav-link" href="./movie.html">Movie</a>
        <a class="nav-link" href="./ECommerce.html">ECommerce</a>
        <a class="nav-link" href="./Food.html">Food</a>
        <a class="nav-link" href="./blood.html">Blood</a>
        <a class="nav-link" href="./flight.html">Flight</a>


      </div>
    </div>
  </div>
</nav>
  <div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm" style="width: 28rem;">
      <div class="card-body">
        <h4 class="card-title text-center mb-4">Blood Booking Form</h4>

        <form id="bloodBookingForm" action="bloodBooking" method="post">
          <div class="mb-3">
            <label for="patientName" class="form-label">Patient Name</label>
            <input type="text" class="form-control" id="patientName" name="patientName" placeholder="Enter patient name" required>
          </div>

          <div class="mb-3">
            <label for="hospitalName" class="form-label">Hospital Name</label>
            <input type="text" class="form-control" id="hospitalName" name="hospitalName" placeholder="Enter hospital name" required>
          </div>

          <div class="mb-3">
            <label for="bloodGroup" class="form-label">Required Blood Group</label>
            <select class="form-select" id="bloodGroup" name="bloodGroup" required>
              <option value="" selected disabled>Select blood group</option>
              <option value="A+">A+</option>
              <option value="B+">B+</option>
              <option value="O+">O+</option>
              <option value="AB+">AB+</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="address" class="form-label">Delivery Address</label>
            <textarea class="form-control" id="address" name="address" rows="2" placeholder="Enter location"></textarea>
          </div>

          <fieldset class="mb-3">
            <legend class="col-form-label small">Urgency</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="urgency" id="urgent" value="Urgent" required>
              <label class="form-check-label" >Urgent</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="urgency" id="normal" value="Normal">
              <label class="form-check-label" >Normal</label>
            </div>
          </fieldset>

          <div class="d-grid">
            <button type="submit" class="btn btn-danger">Book Blood</button>
          </div>
        </form>

      </div>
    </div>
  </div>

</body>
</html>
